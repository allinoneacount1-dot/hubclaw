<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="favLineGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="favGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge> 
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="white" stroke-width="6" filter="url(#favGlow)" />
  
  <!-- Diagonal gradient line -->
  <line x1="28" y1="100" x2="100" y2="28" stroke="url(#favLineGradient)" stroke-width="10" stroke-linecap="round" filter="url(#favGlow)" />
  
  <!-- Decorative elements -->
  <line x1="20" y1="64" x2="44" y2="64" stroke="#a3e635" stroke-width="5" stroke-linecap="round" filter="url(#favGlow)" />
  <line x1="84" y1="90" x2="108" y2="90" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" filter="url(#favGlow)" />
</svg>
