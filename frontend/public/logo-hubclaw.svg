<!-- HubClaw Logo -->
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background glow -->
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Main circle ring -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="white" stroke-width="12" filter="url(#glow)" />
  
  <!-- Diagonal gradient line -->
  <line x1="80" y1="320" x2="320" y2="80" stroke="url(#lineGradient)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Decorative elements -->
  <line x1="60" y1="200" x2="140" y2="200" stroke="#a3e635" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <line x1="260" y1="280" x2="340" y2="280" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
</svg>
